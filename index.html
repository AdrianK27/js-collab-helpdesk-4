
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szkolny Helpdesk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form id="taskForm">
        <label for="title">Tytuł zadania:</label>
        <input
            type="text"
            name="title"
            id="title"
            minlength="3"
            maxlength="80"
            required
        >

        <label for="priority">Priorytet:</label>
        <select name="priority" id="priority" required>
            <option value="low">low</option>
            <option value="normal" selected>normal</option>
            <option value="high">high</option>
        </select>

        <input type="submit" id="submitbtn" value="Dodaj zadanie">
    </form>

    <section class="import-container" aria-labelledby="importHeading">
        <h3 id="importHeading">Import zgłoszeń</h3>

        <label for="importFile">Wybierz plik JSON:</label>

        <input
            type="file"
            id="importFile"
            accept=".json,application/json"
            aria-describedby="importStatus"
        >

        <button type="button" id="importLocalBtn">
            Importuj lokalny JSON
        </button>

        <p id="importStatus" role="status" aria-live="polite"></p>
    </section>

    <div class="filters-container" aria-label="Filtrowanie zgłoszeń">
        <span>Filtry:</span>
        <label>
            <input id="all" type="checkbox" checked>
            All
        </label>
        <label>
            <input id="new" type="checkbox">
            New
        </label>
        <label>
            <input id="doing" type="checkbox">
            Doing
        </label>
        <label>
            <input id="done" type="checkbox">
            Done
        </label>
    </div>

    <div
        class="errorContainer"
        id="errorContainer"
        role="alert"
        aria-live="assertive"
    ></div>

    <div class="komunikat" id="komunikat">
        <p id="ilosc" aria-live="polite"></p>
    </div>

    <ul id="lista" aria-label="Lista zgłoszeń"></ul>

    <script src="app.js" type="module"></script>

</body>
</html>
